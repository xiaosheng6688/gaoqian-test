<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta property="og:title" content="2026人格测试大全 - 搞钱/职场/恋爱">
<meta property="og:description" content="测测你的隐藏人格！搞钱、职场、恋爱三大维度全面解析">
<meta property="og:image" content="https://img.icons8.com/color/200/crystal-ball.png">
<title>2026人格测试大全</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#f5a623;--bg:#1a1a2e;--bg2:#16213e;--text:#fff;--text2:#aab;--accent:#ff6b6b}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.page{display:flex;min-height:100vh;padding:20px;flex-direction:column;align-items:center;justify-content:center}
.landing-title{font-size:32px;font-weight:800;text-align:center;background:linear-gradient(135deg,var(--gold),#ff6b6b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px;line-height:1.3}
.landing-sub{font-size:15px;color:var(--text2);text-align:center;margin-bottom:30px;line-height:1.6}
.landing-icon{font-size:60px;text-align:center;margin-bottom:20px;animation:bounce 2s infinite}
.test-cards{display:flex;flex-direction:column;gap:16px;width:100%;max-width:380px;margin-top:10px}
.test-card{background:linear-gradient(145deg,rgba(245,166,35,0.1),rgba(255,107,107,0.05));border:2px solid rgba(245,166,35,0.2);border-radius:20px;padding:24px;text-align:left;cursor:pointer;transition:all .3s;text-decoration:none;color:var(--text);display:block}
.test-card:hover,.test-card:active{border-color:rgba(245,166,35,0.5);transform:translateY(-2px)}
.test-card-emoji{font-size:40px;margin-bottom:8px}
.test-card-title{font-size:18px;font-weight:700;color:var(--gold);margin-bottom:6px}
.test-card-desc{font-size:13px;color:var(--text2);line-height:1.5}
.test-card-tag{display:inline-block;padding:3px 10px;background:rgba(245,166,35,0.15);border-radius:12px;font-size:11px;color:var(--gold);margin-top:10px}
.footer{margin-top:30px;font-size:12px;color:var(--text2);text-align:center;opacity:0.6}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.particle{position:absolute;width:4px;height:4px;background:var(--gold);border-radius:50%;opacity:0.3;animation:float 6s infinite}
@keyframes float{0%,100%{transform:translateY(0) translateX(0);opacity:0.3}50%{transform:translateY(-100px) translateX(30px);opacity:0.6}}
@media(min-width:500px){.landing-title{font-size:38px}}
</style>
</head>
<body>
<div class="particles" id="particles"></div>

<div class="page">
  <div class="landing-icon">🔮</div>
  <h1 class="landing-title">2026人格测试大全</h1>
  <p class="landing-sub">三大维度，全面解析你的隐藏人格<br>搞钱 · 职场 · 恋爱，测测你是哪种体质</p>
  
  <div class="test-cards">
    <a href="money-test.html" class="test-card">
      <div class="test-card-emoji">💰</div>
      <div class="test-card-title">搞钱人格鉴定</div>
      <div class="test-card-desc">12道题测出你的隐藏搞钱DNA！你是守财龟还是梭哈王？</div>
      <span class="test-card-tag">🐢 12种搞钱人格</span>
    </a>
    
    <a href="work-test.html" class="test-card">
      <div class="test-card-emoji">💼</div>
      <div class="test-card-title">职场人格鉴定</div>
      <div class="test-card-desc">12道题测出你的隐藏职场DNA！你是老黄牛还是野心家？</div>
      <span class="test-card-tag">🚀 12种职场人格</span>
    </a>
    
    <a href="love-test.html" class="test-card">
      <div class="test-card-emoji">💕</div>
      <div class="test-card-title">恋爱人格鉴定</div>
      <div class="test-card-desc">12道题测出你的隐藏恋爱DNA！你是恋爱脑还是冰山美人？</div>
      <span class="test-card-tag">💘 12种恋爱人格</span>
    </a>
  </div>
  
  <div class="footer">🔥 已有 86,432 人完成测试<br>测试仅供娱乐，结果无科学依据</div>
</div>

<script>
function initParticles() {
  const el = document.getElementById('particles');
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.top = Math.random() * 100 + '%';
    p.style.animationDelay = Math.random() * 6 + 's';
    p.style.animationDuration = (4 + Math.random() * 4) + 's';
    el.appendChild(p);
  }
}
initParticles();
</script>
</body>
</html>
